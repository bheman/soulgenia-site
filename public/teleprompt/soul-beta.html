<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111113">
  <title>Teleprompt — Soul Beta</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: oklch(0.115 0.006 285);
      --surface: oklch(0.17 0.008 285 / 0.96);
      --surface-hover: oklch(0.23 0.01 285);
      --text: oklch(0.965 0.006 95);
      --muted: oklch(0.69 0.012 285);
      --border: oklch(0.32 0.012 285);
      --focus: oklch(0.82 0.11 92);
      --space-xs: 0.25rem;
      --space-sm: 0.5rem;
      --space-md: 0.75rem;
      --space-lg: 1rem;
      --script-size: 56px;
      --toolbar-height: 5.5rem;
    }

    * { box-sizing: border-box; }

    html {
      background: var(--bg);
      scrollbar-color: var(--muted) var(--bg);
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Trebuchet MS", "Aptos", sans-serif;
    }

    button,
    .file-button {
      min-height: 2.75rem;
      border: 1px solid var(--border);
      border-radius: 0.55rem;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 140ms ease, border-color 140ms ease, transform 140ms ease;
    }

    button:hover,
    .file-button:hover {
      border-color: var(--muted);
      background: var(--surface-hover);
    }

    button:active,
    .file-button:active { transform: translateY(1px); }

    button:focus-visible,
    .file-button:focus-within {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.42;
    }

    .toolbar {
      position: fixed;
      z-index: 10;
      inset: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-lg);
      min-height: var(--toolbar-height);
      padding: var(--space-md) clamp(0.75rem, 3vw, 2rem);
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      transition: transform 220ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .brand {
      display: grid;
      gap: 0.12rem;
      flex: 0 1 auto;
      min-width: 9rem;
    }

    .brand strong {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.05rem;
      letter-spacing: 0.01em;
    }

    .brand span {
      color: var(--muted);
      font-size: 0.74rem;
      line-height: 1.25;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: var(--space-sm);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: var(--space-xs);
    }

    .icon-button {
      width: 2.75rem;
      padding: 0;
      font-size: 1.35rem;
    }

    .text-button,
    .file-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      padding: 0 var(--space-md);
      white-space: nowrap;
    }

    .file-button input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .size-readout {
      min-width: 4.4rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    [aria-pressed="true"] {
      border-color: var(--text);
      background: var(--text);
      color: var(--bg);
    }

    .progress-track {
      position: fixed;
      z-index: 11;
      inset: var(--toolbar-height) 0 auto;
      height: 2px;
      background: transparent;
      transition: top 220ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background: var(--focus);
    }

    .teleprompter {
      display: grid;
      justify-items: center;
      min-height: 100vh;
      padding: calc(var(--toolbar-height) + 18vh) clamp(1rem, 5vw, 5rem) 62vh;
    }

    .script-shell {
      width: min(100%, 18em);
      font-size: var(--script-size);
      transform-origin: center top;
      transition: transform 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .script {
      margin: 0;
      color: var(--text);
      font-size: 1em;
      font-weight: 650;
      font-variant-ligatures: none;
      line-height: 1.42;
      letter-spacing: 0.005em;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      text-wrap: pretty;
    }

    body.is-mirrored .script-shell { transform: scaleX(-1); }

    .reading-mode-tab {
      position: fixed;
      z-index: 12;
      top: 0;
      left: 50%;
      display: none;
      align-items: center;
      min-height: 2.25rem;
      padding: 0 var(--space-md);
      border-top: 0;
      border-radius: 0 0 0.55rem 0.55rem;
      background: var(--surface);
      color: var(--muted);
      transform: translateX(-50%);
    }

    body.is-reading .toolbar { transform: translateY(-100%); }
    body.is-reading .progress-track { top: 0; }
    body.is-reading .reading-mode-tab { display: inline-flex; }
    body.is-reading .teleprompter { padding-top: 18vh; }

    .toast {
      position: fixed;
      z-index: 20;
      right: var(--space-lg);
      bottom: var(--space-lg);
      max-width: min(25rem, calc(100vw - 2rem));
      padding: var(--space-md) var(--space-lg);
      border: 1px solid var(--border);
      border-radius: 0.55rem;
      background: var(--surface);
      color: var(--text);
      opacity: 0;
      transform: translateY(0.75rem);
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toast.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 820px) {
      :root { --toolbar-height: 8.75rem; }
      .toolbar { align-items: flex-start; }
      .brand span { display: none; }
      .controls { max-width: 31rem; }
      .script { line-height: 1.48; }
      .optional-label { display: none; }
    }

    @media (max-width: 540px) {
      :root { --toolbar-height: 11.75rem; }
      .toolbar { flex-direction: column; }
      .brand {
        display: flex;
        width: 100%;
        justify-content: space-between;
      }
      .controls {
        width: 100%;
        justify-content: flex-start;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <header class="toolbar" aria-label="Controles do teleprompt">
    <div class="brand">
      <strong>Teleprompt</strong>
      <span>Setas ou espaço para navegar · M espelha · H oculta os controles</span>
    </div>

    <div class="controls">
      <div class="control-group" aria-label="Tamanho do texto">
        <button class="icon-button" id="decrease-font" type="button" aria-label="Diminuir fonte">−</button>
        <output class="size-readout" id="font-size" aria-live="polite">56 px</output>
        <button class="icon-button" id="increase-font" type="button" aria-label="Aumentar fonte">+</button>
      </div>

      <button class="text-button" id="mirror" type="button" aria-pressed="false">
        <span aria-hidden="true">↔</span>
        <span>Espelhar</span>
      </button>

      <label class="file-button">
        <span aria-hidden="true">↥</span>
        <span class="optional-label">Trocar texto</span>
        <input id="script-file" type="file" accept=".txt,text/plain">
      </label>

      <button class="text-button" id="reading-mode" type="button">
        <span aria-hidden="true">◱</span>
        <span class="optional-label">Modo leitura</span>
      </button>

      <button class="text-button" id="fullscreen" type="button">
        <span aria-hidden="true">⛶</span>
        <span class="optional-label">Tela cheia</span>
      </button>
    </div>
  </header>

  <div class="progress-track" aria-hidden="true">
    <div class="progress-bar" id="progress"></div>
  </div>

  <button class="reading-mode-tab" id="show-controls" type="button">Mostrar controles · H</button>

  <main class="teleprompter">
    <div class="script-shell">
      <div class="script" id="script" role="document" aria-label="Roteiro da VSL Soul Beta"></div>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const DEFAULT_SCRIPT = "ABERTURA — PROMESSA\r\nTalvez você tenha se acostumado a ser a mulher que dá conta de tudo. \r\n\r\nA que resolve.A que cuida.A que acolhe.\r\n\r\nA que continua mesmo cansada, equilibrando vários pratinhos ao mesmo tempo. \r\n\r\nvocê é aquela que diz “deixa comigo” quando, na verdade, já não sabe mais o que fazer consigo mesma. \r\n\r\nE existe uma coisa que eu quero te mostrar neste vídeo:\r\n\r\nTalvez você não precise aprender a ser mais forte.\r\n\r\nTalvez você já tenha sido forte por tempo demais.\r\n\r\nO que você precisa nao é uma fórmula pronta, nada disso, voce precisa aprender é algo diferente:\r\n\r\ncomo parar de se abandonar enquanto continua vivendo, amando, trabalhando e cuidando das pessoas, das coisas que são importantes para você.\r\n\r\nPorque você não precisa abandonar nada e nem ninguém para parar de se abandonar.\r\n\r\nPrecisa aprender a permanecer ao seu lado enquanto vive a sua vida.\r\n\r\nE é isso que eu quero te ensinar aqui.\r\n\r\nNos próximos minutos, eu vou te mostrar um caminho simples para transformar momentos de confusão emocional em mais clareza, consciência e escolhas que também respeitam você.E não quero que você apenas entenda o que eu vou dizer.Quero que você experimente. que você já saia daqui hoje se sentindo melhor. \r\n\r\nNós vamos fazer juntas três exercícios muito simples durante este vídeo.\r\n\r\nEles vão te ajudar a perceber o que você sente, reconhecer do que precisa e transformar essa percepção em um próximo passo possível.\r\n\r\nSem fórmulas mágicas.\r\n\r\nSem fingir que só pensar positivo resolve tudo.\r\n\r\nSem colocar mais uma obrigação de autocuidado na sua agenda.\r\n\r\nPorque talvez o que esteja faltando não seja fazer mais alguma coisa.\r\n\r\nTalvez seja voltar a se incluir na própria vida.\r\n\r\nPega essa chave: a mudança começa quando você enxerga diferente.  É a nossa mentalidade \tque muda a nossa realidade.\r\n\r\nE daqui a pouco você vai entender exatamente o que eu quero dizer com isso.\r\n\r\n2. GANCHO — PARA QUEM É ESTA AULA\r\nMas antes de continuar, eu quero deixar muito claro para quem é essa conversa.\r\n\r\nPorque talvez você se reconheça mais do que imagina.\r\n\r\n3. PARA QUEM É\r\nEsse vídeo é para você que cuida de tanta gente, ou de tantas coisas, seja trabalho, filhos, familia, e percebe que quase sempre sobra pouco de você para você.\r\n\r\nPara você que diz “sim” e, alguns minutos depois, sente vontade de voltar atrás.\r\n\r\nPara você que evita colocar um limite porque não quer parecer egoísta, difícil ou ingrata.\r\n\r\nPara você que passa uma conversa inteira calada e depois passa horas pensando em tudo o que gostaria de ter dito.\r\n\r\nPara você que às vezes responde no impulso e depois se culpa.\r\n\r\nPara você que já entendeu alguns dos seus padrões, mas continua repetindo alguns deles.\r\n\r\nPara você que promete que vai descansar, se cuidar, se ouvir, voltar a algum projeto importante…\r\n\r\nMas a vida aperta e você desaparece da sua própria lista outra vez.\r\n\r\nPara você que está cansada de precisar chegar ao limite para finalmente reconhecer que alguma coisa não está bem.\r\n\r\nPara você que gostaria de ter mais clareza antes de tomar determinadas decisões.\r\n\r\nE também para você que, em alguns momentos, só queria ter um espaço para colocar para fora aquilo que está vivendo antes de reagir.\r\n\r\nSe alguma dessas situações parece familiar, fica comigo.\r\n\r\nPorque existe uma diferença enorme entre entender que você precisa se cuidar e realmente conseguir não se abandonar no momento em que a vida acontece.\r\n\r\nE é essa diferença que eu quero te mostrar agora.\r\n\r\n4. GANCHO — AUTORIDADE E PROVA\r\nE antes de te ensinar o método, eu preciso ser transparente com você sobre uma coisa.\r\n\r\nA Soul Beta, a nossa mentora virtual, de suporte emocional,  está sendo lançada agora. Esse é um projeto desenhado com muito amor e dedicação. \r\n\r\nPor isso, eu não vou colocar diante de você dezenas de depoimentos. Eu poderia tentar compensar isso com promessas enormes.\r\n\r\nNão é assim que eu quero construir este trabalho. A prova que eu quero começar te oferecendo aqui é outra:\r\n\r\nquero que você experimente a lógica que existe por trás da Soul Beta na sua própria vida, durante este vídeo.\r\n\r\nEu sou Beta Lotti.\r\n\r\nSou escritora, mentora de mulheres e terapeuta,hoje nos meus métodos e cursos,  sao mais de 100 mil alunas. milhares de mulheres que aqui comigo transformaram suas vidas.\r\n\r\n E uma das questões que mais me interessa é a relação que uma mulher constrói consigo mesma.\r\n\r\nPorque podemos aprender muitas coisas sobre relacionamentos, trabalho, família, propósito e sonhos…\r\n\r\nMas existe uma relação da qual você participa durante todos os dias da sua vida:\r\n\r\na relação com você.\r\n\r\nE foi olhando para essa relação que a Soul Beta começou a fazer sentido para mim.\r\n\r\n5. GANCHO — A ORIGEM DO PROBLEMA\r\nPorque existe um tipo de abandono que quase nunca parece abandono enquanto está acontecendo.\r\n\r\nEle acontece em silêncio.\r\n\r\nE talvez seja por isso que tantas mulheres demorem tanto para percebê-lo.\r\n\r\n6. O ERRO: O AUTOABANDONO DISFARÇADO DE FORÇA\r\nO autoabandono raramente começa com uma grande decisão. \r\n\r\nEle acontece em pequenas escolhas repetidas.\r\n\r\nÉ quando você sente alguma coisa e imediatamente pensa:\r\n\r\n“Estou exagerando.”\r\n\r\nÉ quando seu corpo pede descanso e você responde:\r\n\r\n“Só mais um pouco.”\r\n\r\nÉ quando alguma coisa te machuca, mas você aceita para não decepcionar alguém.\r\n\r\nÉ quando quer dizer “não”, mas diz “sim” porque não quer lidar com a culpa.\r\n\r\nÉ quando percebe que alguma situação não está te fazendo bem e, ainda assim, convence a si mesma de que deveria conseguir suportar.\r\n\r\nÉ quando todos ao seu redor entram na agenda…\r\n\r\ne você vira o compromisso que pode ser adiado.\r\n\r\nMais uma vez.\r\n\r\nE mais uma.\r\n\r\nAté que chega um momento em que você não sabe exatamente quando começou a se afastar de si.\r\n\r\nSó percebe que está cansada.\r\n\r\nIrritada.\r\n\r\nConfusa.\r\n\r\nTalvez ansiosa.\r\n\r\nTalvez ressentida.\r\n\r\nTalvez emocionalmente esgotada.\r\n\r\nE então você pensa que precisa de mais disciplina.\r\n\r\nMais força.\r\n\r\nMais controle.\r\n\r\nMais uma rotina.\r\n\r\nMais um hábito.\r\n\r\nMais uma técnica.\r\n\r\nSó que aqui está o problema:\r\n\r\nvocê está tentando resolver o autoabandono exigindo ainda mais de uma mulher que já está sobrecarregada.\r\n\r\nE isso costuma falhar.\r\n\r\n7. POR QUE O JEITO ERRADO FALHA\r\nPorque dizer simplesmente “coloque-se em primeiro lugar” pode parecer bonito.\r\n\r\nMas, para uma mulher acostumada a cuidar de todos, isso pode gerar mais uma cobrança.\r\n\r\nEla pensa:\r\n\r\n“Agora nem cuidar de mim eu consigo.”\r\n\r\nEntão o autocuidado, que deveria ser cuidado, vira uma nova fonte de culpa.\r\n\r\nEla cria uma rotina perfeita.\r\n\r\nMeditação.\r\n\r\nDiário.\r\n\r\nExercício.\r\n\r\nLeitura.\r\n\r\nAlimentação.\r\n\r\nUma lista inteira de coisas que “deveria” fazer.\r\n\r\nConsegue por alguns dias.\r\n\r\nA vida aperta.\r\n\r\nEla não sustenta.\r\n\r\nE conclui:\r\n\r\n“Eu nunca termino nada.”\r\n\r\nPercebe o ciclo?\r\n\r\nO problema não era falta de força.\r\n\r\nA solução proposta é que exigia mais força.\r\n\r\nPor isso, eu não acredito que parar de se abandonar significa se colocar em primeiro lugar o tempo inteiro.\r\n\r\nIsso nem sempre é possível.\r\n\r\nE nem precisa ser.\r\n\r\nParar de se abandonar significa parar de se colocar fora da própria vida.\r\n\r\nSignifica que, enquanto você cuida, ama, trabalha e se relaciona, você também existe dentro das suas decisões.\r\n\r\nE para fazer isso existe um processo.\r\n\r\nEu o organizo assim:\r\n\r\nacolher → perceber → escolher → praticar → integrar.\r\n\r\nAgora eu quero te mostrar como isso funciona.\r\n\r\nE quero fazer isso com você.\r\n\r\nNão depois deste vídeo.\r\n\r\nAgora.\r\n\r\n8. AULA PRÁTICA — PILAR 1\r\nACOLHER E PERCEBER\r\nExiste um erro que fazemos quando uma emoção desconfortável aparece:\r\n\r\ntentamos nos livrar dela antes mesmo de entendê-la.\r\n\r\n“Não posso ficar triste.”\r\n\r\n“Não tenho motivo para estar irritada.”\r\n\r\n“Não deveria estar me sentindo assim.”\r\n\r\n“Tem gente passando por coisa pior.”\r\n\r\n“Eu preciso parar com isso.”\r\n\r\nSó que uma emoção não desaparece simplesmente porque você decidiu que não deveria senti-la.\r\n\r\nÀs vezes, o que desaparece é apenas a sua disposição para escutá-la.\r\n\r\nE quando você deixa de ouvir o que sente, perde informações importantes sobre o que está acontecendo dentro de você.\r\n\r\nEntão o primeiro movimento não é resolver.\r\n\r\nÉ acolher.\r\n\r\nE acolher não significa concordar com tudo o que você pensa.\r\n\r\nNão significa transformar toda emoção em verdade.\r\n\r\nNão significa permanecer na dor.\r\n\r\nSignifica parar de lutar contra você o tempo suficiente para conseguir se ouvir.\r\n\r\nEXERCÍCIO 1 — VOLTAR A SE OUVIR\r\nEu quero fazer uma pausa com você agora.\r\n\r\nNão precisa sair deste vídeo.\r\n\r\nSe puder, coloque os dois pés no chão.\r\n\r\nRespire um pouco mais devagar.\r\n\r\nE, se for confortável para você, coloque uma das mãos sobre o peito.\r\n\r\nNão tente sentir nada especial.\r\n\r\nApenas esteja aqui por alguns segundos.\r\n\r\nAgora se pergunte:\r\n\r\nO que eu estou sentindo neste momento?\r\n\r\nNão explique.\r\n\r\nNão corrija.\r\n\r\nNão julgue.\r\n\r\nApenas tente dar um nome.\r\n\r\nCansaço?\r\n\r\nTristeza?\r\n\r\nIrritação?\r\n\r\nMedo?\r\n\r\nCulpa?\r\n\r\nConfusão?\r\n\r\nSolidão?\r\n\r\nAnsiedade?\r\n\r\nAlívio?\r\n\r\nTalvez você nem saiba ainda.\r\n\r\nTudo bem.\r\n\r\nAgora faça uma segunda pergunta:\r\n\r\nO que aconteceu — ou vem acontecendo — para eu me sentir assim?\r\n\r\nTalvez exista uma conversa que você vem engolindo.\r\n\r\nUm pedido que aceitou sem querer.\r\n\r\nUma relação que está pesando.\r\n\r\nUma expectativa que você está tentando atender.\r\n\r\nUm limite ultrapassado.\r\n\r\nUm cansaço que você vem ignorando.\r\n\r\nUma decisão que está sendo adiada.\r\n\r\nAgora uma terceira pergunta:\r\n\r\nDo que eu preciso neste momento?\r\n\r\nE perceba a diferença.\r\n\r\nEu não perguntei:\r\n\r\n“O que esperam de mim?”\r\n\r\nNem:\r\n\r\n“O que uma pessoa forte faria?”\r\n\r\nEu perguntei:\r\n\r\nDo que eu preciso?\r\n\r\nTalvez seja descanso.\r\n\r\nEspaço.\r\n\r\nAjuda.\r\n\r\nSilêncio.\r\n\r\nClareza.\r\n\r\nUma conversa.\r\n\r\nUm limite.\r\n\r\nAcolhimento.\r\n\r\nOu simplesmente algum tempo antes de decidir.\r\n\r\nAgora complete mentalmente esta frase:\r\n\r\n“O que eu sinto faz sentido porque ______. E neste momento eu preciso de ______.”\r\n\r\nVocê não precisa resolver nada agora.\r\n\r\nO objetivo deste exercício é muito mais simples.\r\n\r\nÉ experimentar algo que talvez você não faça há algum tempo:\r\n\r\nse ouvir sem imediatamente se atacar pelo que ouviu.\r\n\r\nAntes de mudar qualquer coisa na sua vida, você precisa conseguir se ouvir dentro dela.\r\n\r\nPega essa chave: a mudança começa quando você enxerga diferente.\r\n\r\nPorque quando você começa a enxergar o que sente, também começa a perceber o que está por trás das suas reações.\r\n\r\nE é aí que chegamos ao segundo movimento.\r\n\r\n9. AULA PRÁTICA — PILAR 2\r\nESCOLHER E PRATICAR\r\nEntender a si mesma é importante.\r\n\r\nMas existe uma armadilha aqui.\r\n\r\nVocê pode entender perfeitamente um padrão…\r\n\r\ne continuar repetindo esse padrão.\r\n\r\nPode saber por que aceita determinadas situações.\r\n\r\nPode saber de onde vem a sua culpa.\r\n\r\nPode reconhecer que precisa colocar limites.\r\n\r\nPode ter consciência de tudo isso.\r\n\r\nE ainda assim continuar fazendo exatamente a mesma coisa.\r\n\r\nPorque consciência, sozinha, não transforma uma vida.\r\n\r\nEla precisa chegar a uma escolha.\r\n\r\nSó que essa escolha não precisa ser enorme.\r\n\r\nEsse é outro erro que muitas mulheres cometem.\r\n\r\nElas percebem que precisam mudar e imediatamente tentam reformar a vida inteira.\r\n\r\nA conversa vira rompimento.\r\n\r\nO cansaço vira uma promessa de mudar toda a rotina.\r\n\r\nUma insatisfação vira a obrigação de descobrir imediatamente o propósito da vida.\r\n\r\nNão precisa.\r\n\r\nA pergunta é muito menor.\r\n\r\nQual é a próxima escolha possível que também considera você?\r\n\r\nEXERCÍCIO 2 — O PEQUENO ACORDO\r\nEu quero que você complete uma frase:\r\n\r\n“Hoje, para não me abandonar, eu escolho ______.”\r\n\r\nMas existe uma regra.\r\n\r\nEssa escolha precisa ser pequena.\r\n\r\nConcreta.\r\n\r\nPossível.\r\n\r\nE realizável nas próximas 24 horas.\r\n\r\nAlém disso, ela não pode depender de outra pessoa mudar.\r\n\r\nTalvez sua escolha seja:\r\n\r\nesperar antes de responder uma mensagem.\r\n\r\nDizer:\r\n\r\n“Hoje eu não consigo.”\r\n\r\nPedir ajuda em uma tarefa.\r\n\r\nDescansar vinte minutos sem transformar o descanso em culpa.\r\n\r\nEscrever o que gostaria de dizer antes de ter uma conversa.\r\n\r\nCancelar ou renegociar um compromisso que ultrapassou seu limite.\r\n\r\nProcurar ajuda profissional para algo que precisa de um cuidado maior.\r\n\r\nOu separar dez minutos para algo que te reconecte consigo.\r\n\r\nAgora dê mais um passo.\r\n\r\nPergunte:\r\n\r\n“O que exatamente eu vou fazer — e quando?”\r\n\r\nPorque “vou me priorizar” é uma intenção.\r\n\r\nMas:\r\n\r\n“Quando este vídeo terminar, eu vou mandar uma mensagem dizendo que não consigo assumir aquela tarefa”\r\n\r\né uma escolha.\r\n\r\n“Vou controlar minha ansiedade” é uma cobrança.\r\n\r\nMas:\r\n\r\n“Antes de responder aquela pessoa, vou esperar vinte minutos e organizar o que quero dizer”\r\n\r\né uma ação.\r\n\r\nPercebe a diferença?\r\n\r\nVocê não precisa provar para si mesma que consegue transformar toda a sua vida.\r\n\r\nPrecisa começar a construir evidências de que consegue permanecer ao seu lado nas pequenas decisões.\r\n\r\nPorque autoconfiança não nasce quando você promete mudar.\r\n\r\nEla cresce quando você começa a cumprir pequenos acordos consigo mesma.\r\n\r\nE agora existe uma parte ainda mais importante.\r\n\r\nO que acontece quando você tenta…\r\n\r\ne não consegue?\r\n\r\nPorque é justamente aqui que muita gente volta para o autoabandono.\r\n\r\n10. AULA PRÁTICA — PILAR 3\r\nINTEGRAR SEM TRANSFORMAR RECAÍDA EM FRACASSO\r\nImagine que você decidiu colocar um limite.\r\n\r\nChegou a hora.\r\n\r\nA culpa apareceu.\r\n\r\nVocê teve medo.\r\n\r\nE disse “sim” outra vez.\r\n\r\nO pensamento automático costuma ser:\r\n\r\n“Está vendo? Eu sabia.”\r\n\r\n“Eu não consigo mudar.”\r\n\r\n“Voltei para o zero.”\r\n\r\nMas quero te apresentar outra possibilidade.\r\n\r\nE talvez essa seja uma das chaves mais importantes desta aula:\r\n\r\numa experiência que não saiu como você queria ainda pode te ensinar alguma coisa.\r\n\r\nVocê não precisa transformar tudo em julgamento.\r\n\r\nPode transformar em informação.\r\n\r\nÉ isso que significa integrar.\r\n\r\nEXERCÍCIO 3 — NÃO VOLTAR DO ZERO\r\nDepois da escolha que você acabou de fazer — hoje à noite ou depois que a situação acontecer — faça quatro perguntas.\r\n\r\nPrimeira:\r\n\r\nO que eu escolhi fazer?\r\n\r\nApenas lembre o acordo que fez consigo.\r\n\r\nSegunda:\r\n\r\nO que aconteceu quando eu tentei?\r\n\r\nObserve os fatos.\r\n\r\nVocê conseguiu?\r\n\r\nHesitou?\r\n\r\nO que sentiu antes?\r\n\r\nO que sentiu durante?\r\n\r\nO que sentiu depois?\r\n\r\nA reação da outra pessoa foi realmente aquela que você imaginava?\r\n\r\nTerceira pergunta:\r\n\r\nO que essa experiência me ensinou sobre mim?\r\n\r\nTalvez você perceba que sentiu culpa, mas também alívio.\r\n\r\nTalvez descubra que dizer “não” foi menos assustador do que imaginava.\r\n\r\nTalvez perceba que precisava pedir ajuda antes.\r\n\r\nTalvez descubra que o passo escolhido era grande demais para aquele momento.\r\n\r\nE então vem a quarta pergunta:\r\n\r\nQual é o próximo gesto possível?\r\n\r\nVocê pode repetir.\r\n\r\nDiminuir.\r\n\r\nAdaptar.\r\n\r\nOu escolher outra coisa.\r\n\r\nE, se você não conseguiu cumprir o acordo, não pergunte:\r\n\r\n“Por que eu fracassei outra vez?”\r\n\r\nPergunte:\r\n\r\n“O que tornou essa escolha difícil para mim e como posso torná-la mais possível da próxima vez?”\r\n\r\nIsso muda completamente a experiência.\r\n\r\nAquilo que antes servia como prova de que você não consegue mudar passa a ser informação para você se conhecer melhor.\r\n\r\nE eu quero que você guarde esta frase:\r\n\r\n“Eu não preciso voltar do zero. Eu posso voltar do ponto em que me percebi.”\r\n\r\nUma recaída não precisa apagar o caminho.\r\n\r\nEla pode revelar onde você ainda precisa de cuidado.\r\n\r\nConstância emocional não é nunca mais se abandonar.\r\n\r\nÉ perceber cada vez mais cedo quando isso aconteceu e aprender a voltar para si com menos culpa, mais consciência e um próximo passo possível.\r\n\r\nE agora você consegue enxergar o processo inteiro:\r\n\r\nVocê acolhe.\r\n\r\nPercebe.\r\n\r\nEscolhe.\r\n\r\nPratica.\r\n\r\nIntegra.\r\n\r\nE volta.\r\n\r\nQuantas vezes forem necessárias.\r\n\r\nIsso é muito diferente de esperar chegar ao limite para tentar consertar tudo de uma vez.\r\n\r\n11. GANCHO — POR QUE TER APOIO NO MOMENTO REAL MUDA A EXPERIÊNCIA\r\nE talvez você esteja pensando:\r\n\r\n“Beta, eu entendi isso agora. Mas e amanhã?”\r\n\r\nE essa é uma pergunta importante.\r\n\r\nPorque é relativamente fácil enxergar um padrão quando estamos calmas, assistindo a um vídeo.\r\n\r\nO desafio aparece quando a mensagem chega.\r\n\r\nQuando a briga acontece.\r\n\r\nQuando a culpa aperta.\r\n\r\nQuando você está exausta.\r\n\r\n\r\n";

    const MIN_FONT_SIZE = 32;
    const MAX_FONT_SIZE = 104;
    const FONT_STEP = 4;
    const SCROLL_STEP = 96;

    const elements = {
      body: document.body,
      script: document.querySelector("#script"),
      decreaseFont: document.querySelector("#decrease-font"),
      increaseFont: document.querySelector("#increase-font"),
      fontSize: document.querySelector("#font-size"),
      mirror: document.querySelector("#mirror"),
      file: document.querySelector("#script-file"),
      readingMode: document.querySelector("#reading-mode"),
      showControls: document.querySelector("#show-controls"),
      fullscreen: document.querySelector("#fullscreen"),
      progress: document.querySelector("#progress"),
      toast: document.querySelector("#toast")
    };

    let fontSize = Number(localStorage.getItem("teleprompt-font-size")) || 56;
    let mirrored = localStorage.getItem("teleprompt-mirrored") === "true";
    let toastTimer;

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function setFontSize(nextSize) {
      fontSize = clamp(nextSize, MIN_FONT_SIZE, MAX_FONT_SIZE);
      document.documentElement.style.setProperty("--script-size", `${fontSize}px`);
      elements.fontSize.value = `${fontSize} px`;
      elements.decreaseFont.disabled = fontSize === MIN_FONT_SIZE;
      elements.increaseFont.disabled = fontSize === MAX_FONT_SIZE;
      localStorage.setItem("teleprompt-font-size", String(fontSize));
    }

    function setMirrored(nextMirrored, announce = true) {
      mirrored = nextMirrored;
      elements.body.classList.toggle("is-mirrored", mirrored);
      elements.mirror.setAttribute("aria-pressed", String(mirrored));
      localStorage.setItem("teleprompt-mirrored", String(mirrored));
      if (announce) showToast(mirrored ? "Texto espelhado" : "Espelhamento desativado");
    }

    function toggleReadingMode(force) {
      const shouldEnable = typeof force === "boolean"
        ? force
        : !elements.body.classList.contains("is-reading");

      elements.body.classList.toggle("is-reading", shouldEnable);
      showToast(shouldEnable ? "Modo leitura ativado · pressione H para voltar" : "Controles visíveis");
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      elements.toast.textContent = message;
      elements.toast.classList.add("is-visible");
      toastTimer = setTimeout(() => elements.toast.classList.remove("is-visible"), 1800);
    }

    function updateProgress() {
      const scrollable = document.documentElement.scrollHeight - window.innerHeight;
      const percentage = scrollable > 0 ? (window.scrollY / scrollable) * 100 : 0;
      elements.progress.style.width = `${clamp(percentage, 0, 100)}%`;
    }

    function scrollByAmount(amount) {
      window.scrollBy({ top: amount, behavior: "smooth" });
    }

    function isEditableFocused() {
      return document.activeElement?.matches("input, textarea, select, [contenteditable='true']") ?? false;
    }

    elements.script.textContent = DEFAULT_SCRIPT;
    setFontSize(fontSize);
    setMirrored(mirrored, false);

    elements.decreaseFont.addEventListener("click", () => setFontSize(fontSize - FONT_STEP));
    elements.increaseFont.addEventListener("click", () => setFontSize(fontSize + FONT_STEP));
    elements.mirror.addEventListener("click", () => setMirrored(!mirrored));
    elements.readingMode.addEventListener("click", () => toggleReadingMode(true));
    elements.showControls.addEventListener("click", () => toggleReadingMode(false));

    elements.file.addEventListener("change", async (event) => {
      const [file] = event.target.files;
      if (!file) return;

      try {
        elements.script.textContent = await file.text();
        document.title = `Teleprompt — ${file.name.replace(/\.txt$/i, "")}`;
        window.scrollTo({ top: 0, behavior: "instant" });
        updateProgress();
        showToast(`Texto carregado: ${file.name}`);
      } catch {
        showToast("Não foi possível abrir esse arquivo");
      } finally {
        event.target.value = "";
        event.target.blur();
      }
    });

    elements.fullscreen.addEventListener("click", async () => {
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else {
          await document.documentElement.requestFullscreen();
        }
      } catch {
        showToast("O navegador não permitiu a tela cheia");
      }
    });

    document.addEventListener("fullscreenchange", () => {
      const active = Boolean(document.fullscreenElement);
      elements.fullscreen.setAttribute("aria-pressed", String(active));
      showToast(active ? "Tela cheia ativada" : "Tela cheia encerrada");
    });

    document.addEventListener("keydown", (event) => {
      if (isEditableFocused() && event.key !== "Escape") return;

      const pageStep = Math.round(window.innerHeight * 0.72);

      if (event.key === "ArrowDown") {
        event.preventDefault();
        scrollByAmount(SCROLL_STEP);
      } else if (event.key === "ArrowUp") {
        event.preventDefault();
        scrollByAmount(-SCROLL_STEP);
      } else if (event.key === "PageDown" || (event.key === " " && !event.shiftKey)) {
        event.preventDefault();
        scrollByAmount(pageStep);
      } else if (event.key === "PageUp" || (event.key === " " && event.shiftKey)) {
        event.preventDefault();
        scrollByAmount(-pageStep);
      } else if (event.key.toLowerCase() === "m") {
        event.preventDefault();
        setMirrored(!mirrored);
      } else if (event.key.toLowerCase() === "h") {
        event.preventDefault();
        toggleReadingMode();
      } else if (event.key === "+" || event.key === "=") {
        event.preventDefault();
        setFontSize(fontSize + FONT_STEP);
      } else if (event.key === "-") {
        event.preventDefault();
        setFontSize(fontSize - FONT_STEP);
      } else if (event.key === "Escape" && elements.body.classList.contains("is-reading")) {
        toggleReadingMode(false);
      }
    });

    window.addEventListener("scroll", updateProgress, { passive: true });
    window.addEventListener("resize", updateProgress);
    updateProgress();
  </script>
</body>
